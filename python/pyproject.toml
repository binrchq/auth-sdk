[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binrc-auth"
version = "1.0.1"
description = "Binrc public auth SDK for Python — OIDC + PKCE client, FastAPI / Flask middleware, and Device flow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0"
]
authors = [
    { name = "Binrc Auth Team", email = "dev@binrc.com" }
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.0.0"]
cli = ["click>=8.0.0"]
